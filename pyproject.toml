[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scigeoguard-x"
version = "0.1.0"
description = "Evidence-carrying scientific checks for Earth-observation workflows"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["scigeoguard_core", "scigeoguard_v11"]
